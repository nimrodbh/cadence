[project]
name = "cadence"
version = "0.1.0"
description = "A scheduling and habit agent with an MCP server and an evaluation harness"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]  # 2.x renamed FastMCP and changed the client API; revisit when migrating

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
packages = ["cadence", "cadence.evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
